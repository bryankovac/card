<style>
:root{
  --blue:#007AC2;
  --blue-dark:#0069A8;
  --navy-1:#0E3350;
  --navy-2:#0A2438;
  --ink:#10222F;
  --mut:#5A6B78;
  --faint:#8A98A4;
  --hair:rgba(16,42,67,.10);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;padding:28px 18px;
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(900px 620px at 88% -12%,rgba(0,122,194,.09),transparent 62%),
    radial-gradient(760px 540px at -12% 112%,rgba(10,36,56,.08),transparent 60%),
    #EDF0F3;
}

.card{
  width:min(100%,470px);border-radius:20px;overflow:hidden;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(13,34,53,.10);
  box-shadow:0 30px 60px -28px rgba(13,34,53,.35),0 2px 8px rgba(13,34,53,.06);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:#fff}
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .55s cubic-bezier(.22,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
}

/* Identity panel */
.panel{
  display:flex;align-items:center;gap:16px;padding:18px 22px;
  background:linear-gradient(135deg,var(--navy-1),var(--navy-2));
}
.avatar{
  width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 6px 14px -6px rgba(0,0,0,.5);
}
.panel-org{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);min-width:0}
.org-name{
  font-size:.66rem;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.78);line-height:1.6;
}
.org-sub{font-size:.6rem;font-weight:400;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.42)}

/* Content */
.content{position:relative;padding:26px 24px 16px}
.lang{
  position:absolute;top:24px;right:24px;
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:.7rem;
}
.lang button{
  appearance:none;border:0;background:none;padding:2px 1px;cursor:pointer;
  font:inherit;font-weight:500;letter-spacing:.08em;color:var(--faint);
  border-bottom:2px solid transparent;
}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.lang-sep{color:rgba(16,42,67,.25)}

h1{margin:2px 0 0;font-size:1.72rem;font-weight:600;letter-spacing:-.015em;line-height:1.15;padding-right:76px}
.title{margin:8px 0 0;font-size:.94rem;font-weight:400;line-height:1.55;color:var(--mut);max-width:36ch}

.cta{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;margin-top:22px;padding:13px 18px;
  border:0;border-radius:11px;background:var(--blue);color:#fff;
  font-family:inherit;font-size:.94rem;font-weight:600;line-height:1;
  text-decoration:none;cursor:pointer;
  box-shadow:0 1px 2px rgba(13,34,53,.2),0 10px 22px -10px rgba(0,122,194,.55);
  transition:background .15s ease,transform .12s ease;
}
@media (hover:hover){.cta:hover{background:var(--blue-dark)}}
.cta:active{transform:translateY(1px)}
.cta svg{flex:none}
.hint{margin:9px 0 0;font-size:.72rem;color:var(--faint)}

/* Contact rows */
.rows{margin-top:20px;border-top:1px solid var(--hair)}
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 2px;border-bottom:1px solid var(--hair);
  text-decoration:none;color:inherit;
}
.rows .row:last-child{border-bottom:0}
.row-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-label{
  font-family:var(--mono);font-size:.62rem;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
}
.row-value{
  font-size:.94rem;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row svg{margin-left:auto;flex:none;width:16px;height:16px;color:#B6C2CC;transition:color .15s ease,transform .15s ease}
@media (hover:hover){
  .row:hover .row-value{color:var(--blue)}
  .row:hover svg{color:var(--blue);transform:translateX(2px)}
}

a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* Desktop: landscape business-card composition */
@media (min-width:760px){
  .card{width:min(100%,720px);display:grid;grid-template-columns:236px 1fr}
  .panel{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:26px;padding:26px 24px}
  .avatar{width:128px;height:128px;border-radius:16px}
  .content{padding:34px 38px 24px}
  h1{font-size:1.95rem;padding-right:86px}
  .cta{width:auto;padding:13px 26px}
}
</style>
</head>

function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (I18N[l][k]) el.textContent = I18N[l][k];
  });
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === l))
  );
}
document.querySelectorAll('.lang button').forEach(b =>
  b.addEventListener('click', () => setLang(b.dataset.lang))
);
